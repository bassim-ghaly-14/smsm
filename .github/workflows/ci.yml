name: SMSM CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_type == 'tag' && 'tag' || 'branch' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript type-check
        run: ./node_modules/.bin/tsc --noEmit

      - name: ESLint
        run: ./node_modules/.bin/eslint . --ext .ts,.tsx

      - name: Expo Doctor
        run: npx expo-doctor

  android-signing-check:
    name: Check Android signing configuration
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      signing_configured: ${{ steps.check-signing.outputs.signing_configured }}
    steps:
      - id: check-signing
        name: Determine Android signing path
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            missing=0
            for secret in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              value="${!secret}"
              if [ -z "$value" ]; then
                echo "ERROR: Required signing secret '$secret' is not configured." >&2
                echo "Either configure all four Android signing secrets, or none." >&2
                missing=1
              fi
            done
            if [ "$missing" -eq 1 ]; then
              exit 1
            fi
            echo "Android release signing is configured. Signed release APK path will be used." >> $GITHUB_STEP_SUMMARY
            echo "signing_configured=true" >> $GITHUB_OUTPUT
          else
            echo "No Android release keystore configured. Debug validation build will be used." >> $GITHUB_STEP_SUMMARY
            echo "signing_configured=false" >> $GITHUB_OUTPUT
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    needs:
      - quality
      - android-signing-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up JDK 17
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Generate Android project (Expo Prebuild)
        run: ./node_modules/.bin/expo prebuild --clean -p android

      # ---------- Path A: Signed release APK ----------
      - name: Write release keystore
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/smsm-release-keystore.jks
          echo "Keystore written ($(wc -c < android/app/smsm-release-keystore.jks) bytes)"
          chmod 600 android/app/smsm-release-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Patch release signing configuration
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: node scripts/prepare-android-signing.js

      - name: Build release APK
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: cd android && ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT" -path '*build-tools/*/apksigner' -type f | head -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found under $SDK_ROOT/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Verify package ID (release)
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT" -path '*build-tools/*/aapt' -type f | head -n 1)"
          if [ -z "$AAPT" ]; then
            echo "aapt not found" >&2
            exit 1
          fi
          PACKAGE_ID="$("$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -oE 'package: name=[^ ]+' | cut -d'=' -f2 | tr -d "'")"
          if [ "$PACKAGE_ID" != "com.smsm.app" ]; then
            echo "Unexpected package ID: $PACKAGE_ID" >&2
            exit 1
          fi
          echo "Package ID verified: $PACKAGE_ID"

      - name: Prepare signed release artifact
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/SMSM-Android.apk
          echo "SMSM-Android.apk ready (signed release)"

      - name: Upload signed release APK
        if: needs.android-signing-check.outputs.signing_configured == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: SMSM-Android
          path: android/app/build/outputs/apk/release/SMSM-Android.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- Path B: Debug validation APK ----------
      - name: Build debug validation APK
        if: needs.android-signing-check.outputs.signing_configured == 'false'
        run: cd android && ./gradlew --no-daemon :app:assembleDebug

      - name: Verify debug APK exists
        if: needs.android-signing-check.outputs.signing_configured == 'false'
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK not found at expected location" >&2
            exit 1
          fi

      - name: Verify package ID (debug)
        if: needs.android-signing-check.outputs.signing_configured == 'false'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT" -path '*build-tools/*/aapt' -type f | head -n 1)"
          if [ -z "$AAPT" ]; then
            echo "aapt not found" >&2
            exit 1
          fi
          PACKAGE_ID="$("$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -oE 'package: name=[^ ]+' | cut -d'=' -f2 | tr -d "'")"
          if [ "$PACKAGE_ID" != "com.smsm.app" ]; then
            echo "Unexpected package ID: $PACKAGE_ID" >&2
            exit 1
          fi
          echo "Package ID verified: $PACKAGE_ID"

      - name: Prepare debug validation artifact
        if: needs.android-signing-check.outputs.signing_configured == 'false'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SMSM-Android-validation.apk
          echo "SMSM-Android-validation.apk ready (development validation only, not a production release)"

      - name: Upload debug validation APK
        if: needs.android-signing-check.outputs.signing_configured == 'false'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: SMSM-Android-nosign-validation
          path: android/app/build/outputs/apk/debug/SMSM-Android-validation.apk
          if-no-files-found: error
          retention-days: 30

  ios-simulator-build:
    name: iOS simulator build
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate iOS project (Expo Prebuild)
        run: ./node_modules/.bin/expo prebuild --clean -p ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods -N

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Resolve simulator UDID
        id: simulator
        run: |
          SIM_LINE="$(xcrun simctl list devices available | grep 'iPhone' | head -n 1)"
          if [ -z "$SIM_LINE" ]; then
            echo "No iPhone simulator available on the macOS runner." >&2
            exit 1
          fi
          SIM_UDID="$(echo "$SIM_LINE" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -n 1)"
          SIM_NAME="$(echo "$SIM_LINE" | sed -E 's/\([^)]*\)//' | sed 's/  */ /g' | sed 's/^ //' | sed 's/ $//')"
          if [ -z "$SIM_UDID" ]; then
            echo "Could not resolve simulator UDID from: $SIM_LINE" >&2
            exit 1
          fi
          echo "simulator_udid=$SIM_UDID" >> $GITHUB_OUTPUT
          echo "simulator_name=$SIM_NAME" >> $GITHUB_OUTPUT
          echo "Using simulator: $SIM_NAME ($SIM_UDID)" >> $GITHUB_STEP_SUMMARY

      - name: Build iOS simulator .app
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcodebuild -workspace ios/SMSM.xcworkspace \
            -scheme SMSM \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_udid }}" \
            -derivedDataPath ios/build \
            build

      - name: Locate simulator .app
        id: locate-app
        run: |
          APP_PATH="$(find ios/build -name 'SMSM.app' -type d -maxdepth 6 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Simulator .app not found after build" >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Simulator app found: $APP_PATH" >> $GITHUB_STEP_SUMMARY

      - name: Upload iOS simulator .app
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: SMSM-iOS-Simulator
          path: ${{ steps.locate-app.outputs.app_path }}
          if-no-files-found: error
          retention-days: 30
